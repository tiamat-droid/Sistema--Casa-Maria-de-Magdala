{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Restrita | Casa Maria de Magdala</title>

    <!-- Folha de estilo separada -->
    <link rel="stylesheet" href="{% static 'css/interface/login.css' %}">
</head>

<body>

    <main class="pagina-login">

        <section class="area-login">

            <div class="conteudo-login">

                <div class="indicador"></div>

                <h1>Área Restrita</h1>
                <p style="color: #64748b; font-size: 14px; margin-bottom: 24px; margin-top: -15px;">
                    Acesso exclusivo para colaboradores e equipe técnica da Casa Maria de Magdala.
                </p>

                <!-- Formulário com redirecionamento no teste front-end -->
                <form id="formLogin" class="formulario-login" onsubmit="realizarLogin(event)">

                    <div class="campo">
                        <label for="usuario">Usuário ou E-mail</label>
                        <input
                            type="text"
                            id="usuario"
                            name="usuario"
                            autocomplete="username"
                            placeholder="Seu usuário cadastrado"
                            required
                        >
                    </div>

                    <div class="campo">
                        <div class="senha-cabecalho">
                            <label for="senha">Senha</label>
                            <button
                                type="button"
                                id="btnToggleSenha"
                                class="mostrar-senha"
                                onclick="alternarVisibilidadeSenha()"
                            >
                                👁️ Mostrar
                            </button>
                        </div>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            autocomplete="current-password"
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <!-- Mensagem de erro dinâmica -->
                    <div id="alertaErro" style="display: none; padding: 10px 14px; background-color: #fee2e2; border: 1px solid #fca5a5; border-radius: 8px; color: #dc2626; font-size: 13px; font-weight: 600; margin-bottom: 16px;">
                        Usuário ou senha incorretos.
                    </div>

                    <button
                        type="submit"
                        class="botao-acessar"
                        id="btnAcessar"
                    >
                        Acessar Sistema
                    </button>

                </form>

            </div>

        </section>

        <section class="area-visual">
            <div style="text-align: center; color: white; padding: 40px; max-width: 460px;">
                <div style="width: 72px; height: 72px; background: rgba(255,255,255,0.15); border-radius: 16px; margin: 0 auto 24px auto; display: flex; align-items: center; justify-content: center; font-size: 32px; backdrop-filter: blur(10px);">
                    ❤️
                </div>
                <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px;">Casa Maria de Magdala</h2>
                <p style="font-size: 15px; opacity: 0.9; line-height: 1.6;">
                    Acolhimento, dignidade e assistência humanizada a pessoas que convivem com HIV/AIDS.
                </p>
            </div>
        </section>

    </main>

    <!-- Script JavaScript Separado e Modular -->
    <script src="{% static 'js/interface/login.js' %}"></script>

</body>

</html>
